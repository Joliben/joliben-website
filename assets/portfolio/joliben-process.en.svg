<line x1="808" y1="395" x2="798" y2="402" stroke="#315fe8" stroke-width="3"/>
<rect x="44" y="620" width="1112" height="137" rx="18" fill="#fffaf0" stroke="#ddc98b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="67" y="660" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#80560d" id="en-text-35">FEED KNOWLEDGE BACK WITH CONTROL</text>
<text x="67" y="698" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#17243b" id="en-text-36">Update project knowledge, link results and retrieve them traceably later.</text>
<text x="67" y="735" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#80560d" id="en-text-37">In progress: import, retrieval and an effective learning loop have not yet been demonstrated.</text>
<line x1="600" y1="596" x2="600" y2="614" stroke="#80560d" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="600" y1="614" x2="593" y2="604" stroke="#80560d" stroke-width="3"/>
<line x1="600" y1="614" x2="607" y2="604" stroke="#80560d" stroke-width="3"/>
<text x="44" y="799" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17243b" id="en-text-38">The workflows do not yet form a connected, autonomous end-to-end process.</text>
<text x="44" y="834" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#55657d" id="en-text-39">Project status: 15–20 Oct 2026 / Edited: 22 Oct 2026 / Public conceptual illustration</text>
