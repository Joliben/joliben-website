<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Case study 03: A limited Inbox repair</title>
<desc id="desc">The historical decision path separates a rejected assignment of global warnings from the accepted repair to the read-only display. Selected tests, HTTP checks and user confirmation at the time establish the limited success. The global history remained unresolved; strict start checks were unchanged.</desc>
<rect x="0" y="0" width="1600" height="1190" rx="0" fill="#f4f7fb" stroke="none" stroke-width="2"/>
<text x="72" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#315fe8" id="en-text-02">JOLIBEN / CASE STUDY 03</text>
<text x="72" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="700" fill="#17243b" id="en-text-03">Look closer. Repair precisely.</text>
<text x="72" y="181" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#53637a" id="en-text-04">Historical Inbox case: 15 Oct 2026 / Editorial illustration</text>
<rect x="292" y="223" width="1016" height="130" rx="18" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="324" y="268" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#315fe8" id="en-text-05">INBOX UNREACHABLE: HTTP 500</text>
<text x="324" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#17243b" id="en-text-06">Diagnosis leads to a global history conflict.</text>
<line x1="800" y1="362" x2="800" y2="400" stroke="#315fe8" stroke-width="3"/>
<line x1="800" y1="400" x2="792" y2="388" stroke="#315fe8" stroke-width="3"/>
<line x1="800" y1="400" x2="808" y2="388" stroke="#315fe8" stroke-width="3"/>
<rect x="292" y="411" width="1016" height="103" rx="18" fill="#edf2ff" stroke="none" stroke-width="2"/>
<text x="324" y="451" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#315fe8" id="en-text-07">THE SUBSTANTIVE QUESTION</text>
<text x="324" y="488" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243b" id="en-text-08">Which state may the individual task display?</text>
<line x1="800" y1="523" x2="800" y2="547" stroke="#315fe8" stroke-width="3"/>
<line x1="416" y1="547" x2="1184" y2="547" stroke="#315fe8" stroke-width="3"/>
<line x1="416" y1="547" x2="416" y2="575" stroke="#9c343a" stroke-width="3"/>
<line x1="416" y1="575" x2="408" y2="563" stroke="#9c343a" stroke-width="3"/>
<line x1="416" y1="575" x2="424" y2="563" stroke="#9c343a" stroke-width="3"/>
<line x1="1184" y1="547" x2="1184" y2="575" stroke="#086c60" stroke-width="3"/>
<line x1="1184" y1="575" x2="1176" y2="563" stroke="#086c60" stroke-width="3"/>
<line x1="1184" y1="575" x2="1192" y2="563" stroke="#086c60" stroke-width="3"/>
<rect x="72" y="588" width="688" height="264" rx="18" fill="#fbebed" stroke="#e5c5c9" stroke-width="2"/>
<text x="104" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c343a" id="en-text-09">FIRST CANDIDATE: REJECTED</text>
<text x="104" y="679" font-family="DejaVu Sans,Arial,sans-serif" font-size="24.7" font-weight="700" fill="#17243b" id="en-text-10">Global warnings assigned to individual tasks</text>
<text x="104" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#17243b" id="en-text-11">338 selected tests passed.</text>
<text x="104" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#53637a" id="en-text-12">The assignment would have claimed more</text>
<text x="104" y="795" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#53637a" id="en-text-13">than the evidence supported for these tasks.</text>
<rect x="840" y="588" width="688" height="264" rx="18" fill="#e6f4ef" stroke="#beddd2" stroke-width="2"/>
<text x="872" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#086c60" id="en-text-14">LATER REPAIR: ACCEPTED</text>
<text x="872" y="679" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243b" id="en-text-15">Repair the read-only display precisely</text>
<text x="872" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#17243b" id="en-text-16">Keep the global notice visible separately.</text>
<text x="872" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-17">Start and approval checks unchanged.</text>
<text x="872" y="795" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-18">The global history remains a separate task.</text>
<line x1="1184" y1="860" x2="1184" y2="893" stroke="#086c60" stroke-width="3"/>
<line x1="1184" y1="893" x2="1176" y2="881" stroke="#086c60" stroke-width="3"/>
<line x1="1184" y1="893" x2="1192" y2="881" stroke="#086c60" stroke-width="3"/>
<rect x="840" y="905" width="688" height="115" rx="18" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="872" y="948" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#086c60" id="en-text-19">344 selected tests / 13 HTTP checks</text>
<text x="872" y="987" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#17243b" id="en-text-20">Inbox HTTP 200 via both paths; user confirmed.</text>
<text x="104" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-21">Test counts describe the scope of their checks.</text>
<text x="104" y="969" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17243b" id="en-text-22">Substantive assessment remains necessary.</text>
<rect x="72" y="1052" width="1456" height="87" rx="18" fill="#fff4dc" stroke="#ddc98b" stroke-width="2"/>
<text x="104" y="1088" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#80560d" id="en-text-23">THE LIMIT REMAINS VISIBLE</text>
<text x="104" y="1120" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#17243b" id="en-text-24">An accessible Inbox does not resolve a global history conflict or grant approval to execute.</text>
</svg>