<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Case study 02: From a request to a traceable task</title>
<desc id="desc">Six documented steps connect a review request with an AI plan, deliberate project selection and a task that was actually created. The original plan remains readable. The subsequent substantive work was neither approved nor carried out in the documented case.</desc>
<rect x="0" y="0" width="1600" height="1040" rx="0" fill="#f4f7fb" stroke="none" stroke-width="2"/>
<text x="72" y="77" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#315fe8" id="en-text-02">JOLIBEN / CASE STUDY 02</text>
<text x="72" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#17243b" id="en-text-03">From a request to a traceable task.</text>
<text x="72" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#53637a" id="en-text-04">Documented case: 19 Oct 2026 / Public write-up: 22 Oct 2026</text>
<rect x="72" y="235" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
