<text x="99" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b" id="en-text-06">State the request</text>
<text x="99" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-07">An existing project area</text>
<text x="99" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-08">needs to be reviewed.</text>
<rect x="578" y="235" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="605" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8" id="en-text-09">02</text>
<text x="605" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b" id="en-text-10">Context and approval</text>
<text x="605" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-11">Review the selected data and</text>
<text x="605" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-12">costs for the AI step.</text>
<rect x="1084" y="235" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="1111" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8" id="en-text-13">03</text>
<text x="1111" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b" id="en-text-14">Review the AI plan</text>
<text x="1111" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-15">Review the proposal and</text>
<text x="1111" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-16">weigh the next steps.</text>
<rect x="1084" y="535" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="1111" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8" id="en-text-17">04</text>
<text x="1111" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b" id="en-text-18">Choose the project</text>
<text x="1111" y="681" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-19">Explicitly assign the task</text>
<text x="1111" y="713" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-20">to the appropriate project.</text>
<rect x="578" y="535" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="605" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8" id="en-text-21">05</text>
<text x="605" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b" id="en-text-22">Confirm the task</text>
<text x="605" y="681" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-23">Create the task deliberately;</text>
<text x="605" y="713" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-24">its creation becomes traceable.</text>
<rect x="72" y="535" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="99" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8" id="en-text-25">06</text>
<text x="99" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b" id="en-text-26">Read the original plan</text>
<text x="99" y="681" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-27">The unchanged source remains</text>
<text x="99" y="713" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a" id="en-text-28">traceable within the task.</text>
