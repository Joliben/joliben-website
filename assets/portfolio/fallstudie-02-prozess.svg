<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Fallstudie 02: Vom Wunsch zur nachvollziehbaren Aufgabe</title>
<desc id="desc">Sechs dokumentierte Schritte verbinden ein Prüfanliegen mit einem KI-Plan, bewusster Projektwahl und einer tatsächlich angelegten Aufgabe. Der Originalplan bleibt lesbar. Die anschließende fachliche Bearbeitung wurde im dokumentierten Fall nicht freigegeben oder ausgeführt.</desc>
<rect x="0" y="0" width="1600" height="1040" rx="0" fill="#f4f7fb" stroke="none" stroke-width="2"/>
<text x="72" y="77" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#315fe8">JOLIBEN / FALLSTUDIE 02</text>
<text x="72" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#17243b">Vom Wunsch zur nachvollziehbaren Aufgabe.</text>
<text x="72" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#53637a">Dokumentierter Fall vom 19.10.2026 / öffentliche Ausarbeitung vom 22.10.2026</text>
<rect x="72" y="235" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="99" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8">01</text>
<text x="99" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b">Wunsch formulieren</text>
<text x="99" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">Ein vorhandener Projektbereich</text>
<text x="99" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">soll geprüft werden.</text>
<rect x="578" y="235" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="605" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8">02</text>
<text x="605" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b">Kontext und Freigabe</text>
<text x="605" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">Ausgewählte Daten und Kosten</text>
<text x="605" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">für den KI-Schritt prüfen.</text>
<rect x="1084" y="235" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="1111" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8">03</text>
<text x="1111" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b">KI-Plan ansehen</text>
<text x="1111" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">Den Vorschlag prüfen und</text>
<text x="1111" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">die nächsten Schritte abwägen.</text>
<rect x="1084" y="535" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="1111" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8">04</text>
<text x="1111" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b">Projekt bewusst wählen</text>
<text x="1111" y="681" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">Die Aufgabe ausdrücklich</text>
<text x="1111" y="713" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">dem passenden Projekt zuordnen.</text>
<rect x="578" y="535" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="605" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8">05</text>
<text x="605" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b">Aufgabe bestätigen</text>
<text x="605" y="681" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">Den Auftrag bewusst anlegen;</text>
<text x="605" y="713" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">die Anlage wird nachvollziehbar.</text>
<rect x="72" y="535" width="444" height="225" rx="22" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/>
<text x="99" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#315fe8">06</text>
<text x="99" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17243b">Originalplan lesen</text>
<text x="99" y="681" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">Die unveränderte Quelle bleibt</text>
<text x="99" y="713" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#53637a">an der Aufgabe nachvollziehbar.</text>
