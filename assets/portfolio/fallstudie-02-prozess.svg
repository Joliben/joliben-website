<line x1="294" y1="815" x2="286" y2="803" stroke="#80560d" stroke-width="3"/>
<line x1="294" y1="815" x2="302" y2="803" stroke="#80560d" stroke-width="3"/>
<rect x="72" y="827" width="1456" height="134" rx="20" fill="#fff4dc" stroke="#ddc98b" stroke-width="2"/>
<text x="100" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#80560d">NÄCHSTER SCHRITT: FACHLICHE BEARBEITUNG GESONDERT KLÄREN</text>
<text x="100" y="914" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#17243b">Für diesen Prüffall nicht freigegeben und nicht ausgeführt. Ein fertiger Befundbericht ist noch nicht belegt.</text>
<text x="72" y="1003" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#53637a">Redaktionelle Prinzipdarstellung / kein Bildschirmfoto / keine zusätzliche Ausführungsfreigabe</text>
