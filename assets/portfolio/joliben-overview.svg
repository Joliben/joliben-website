<title id="title">JOLIBEN - öffentliche Projektarbeitsprobe</title><desc id="desc">KI sinnvoll einsetzen. Ergebnisse prüfbar machen. Thiemo Gerhardt, Initiator und Product Owner. Aktive Entwicklung mit ausgewählten erprobten Teilwegen.</desc>
